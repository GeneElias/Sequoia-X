name: Private research diagnostics
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/research-diagnostics.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: sequoia-paper-state
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra reports --extra github --extra dev --python 3.12
      - run: .venv/bin/python -m sequoia_x.reporting.github_runner --task selftest
      - run: .venv/bin/python -m sequoia_x.reporting.diagnostics --full
        env:
          SEQUOIA_STATE_KEY: ${{ secrets.SEQUOIA_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}

