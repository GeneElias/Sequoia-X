name: Sequoia daily research and weekly paper review

on:
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '30 23 * * 1-5'
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      task:
        description: 'selftest uses synthetic tests only; validate checks encrypted state without sending'
        type: choice
        options: [selftest, validate, daily_A, daily_US, weekly]
        default: selftest

permissions:
  contents: write

concurrency:
  group: sequoia-paper-state
  cancel-in-progress: false

jobs:
  research:
    name: "Research (schedules enabled: ${{ vars.SEQUOIA_ENABLED != 'false' }})"
    # Migration validated: schedules are on by default; set the repository variable
    # SEQUOIA_ENABLED=false to pause without editing this workflow.
    if: github.event_name == 'workflow_dispatch' || vars.SEQUOIA_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked free reporting dependencies
        run: uv sync --frozen --extra reports --extra github --extra dev --python 3.12
      - name: Restore, run and persist encrypted paper state
        env:
          SEQUOIA_STATE_KEY: ${{ secrets.SEQUOIA_STATE_KEY }}
          FEISHU_REPORT_WEBHOOK_URL: ${{ secrets.FEISHU_REPORT_WEBHOOK_URL }}
          FEISHU_REPORT_SECRET: ${{ secrets.FEISHU_REPORT_SECRET }}
          SEQUOIA_CRON: ${{ github.event.schedule }}
          SEQUOIA_TASK: ${{ inputs.task }}
          SEQUOIA_SCHEDULE_PAUSED: ${{ vars.SEQUOIA_ENABLED == 'false' }}
          FEISHU_DASHBOARD_URL: ${{ vars.FEISHU_DASHBOARD_URL || 'https://geneelias.github.io/Sequoia-X/' }}
        run: |
          if [ -n "$SEQUOIA_TASK" ]; then
            .venv/bin/python -m sequoia_x.reporting.github_runner --task "$SEQUOIA_TASK"
          else
            .venv/bin/python -m sequoia_x.reporting.github_runner
          fi
