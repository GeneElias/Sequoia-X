name: Sequoia daily research and weekly paper review

on:
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '30 23 * * 1-5'
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      task:
        description: 'validate checks encrypted state without sending; others run the real simulation'
        type: choice
        options: [validate, daily_A, daily_US, weekly]
        default: validate

permissions:
  contents: write

concurrency:
  group: sequoia-paper-state
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || vars.SEQUOIA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked free reporting dependencies
        run: uv sync --frozen --extra reports --extra github --python 3.12
      - name: Restore, run and persist encrypted paper state
        env:
          SEQUOIA_STATE_KEY: ${{ secrets.SEQUOIA_STATE_KEY }}
          FEISHU_REPORT_WEBHOOK_URL: ${{ secrets.FEISHU_REPORT_WEBHOOK_URL }}
          FEISHU_REPORT_SECRET: ${{ secrets.FEISHU_REPORT_SECRET }}
          FEISHU_DASHBOARD_URL: ${{ vars.FEISHU_DASHBOARD_URL }}
          SEQUOIA_CRON: ${{ github.event.schedule }}
          SEQUOIA_TASK: ${{ inputs.task }}
        run: |
          if [ -n "$SEQUOIA_TASK" ]; then
            .venv/bin/python -m sequoia_x.reporting.github_runner --task "$SEQUOIA_TASK"
          else
            .venv/bin/python -m sequoia_x.reporting.github_runner
          fi
